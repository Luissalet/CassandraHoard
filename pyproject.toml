[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-hoard"
version = "0.1.0"
description = "Observability for the local AI stack: health of every local service, incidents with their probable cause, logs, GPU timeline and opt-in restarts, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
icon = ["pillow>=11", "numpy>=2", "opencv-python-headless>=4.10"]

[project.scripts]
cassandra-hoard = "cassandra_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["cassandra_hoard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
